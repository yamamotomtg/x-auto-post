# 投稿漏れの見張り役。
# ふだんの投稿は Cloudflare が行うので、ここでは「出ているはずの投稿が X にあるか」だけを
# 1日2回確かめます。見つからなければ失敗し、GitHub からメールが届きます。
# （この点検は数時間ずれても役目を果たすので、GitHub の実行時刻の遅れは問題になりません）
name: 投稿漏れの点検

on:
  schedule:
    - cron: '0 3 * * *' # 日本時間 正午ごろ
    - cron: '0 15 * * *' # 日本時間 真夜中ごろ
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node post.mjs
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          WATCHDOG: 'true'
