# 投稿漏れの見張り役。
# ふだんの投稿は Cloudflare が行うので、ここでは「出ているはずの回を Cloudflare が
# 投稿したという記録があるか」だけを1日2回確かめます。
# 記録がなければ失敗し、GitHub からメールが届きます。
# （この点検は数時間ずれても役目を果たすので、GitHub の実行時刻の遅れは問題になりません）
name: 投稿漏れの点検

on:
  schedule:
    - cron: '0 3 * * *' # 日本時間 正午ごろ
    - cron: '0 15 * * *' # 日本時間 真夜中ごろ
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # X への問い合わせは行わないので、キーは要りません
      - run: node post.mjs
        env:
          WATCHDOG: 'true'
