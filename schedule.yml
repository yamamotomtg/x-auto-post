# 投稿ルール
# このファイルは管理画面（npm start）から書き換えられます。
# 手で直すこともできますが、直したあとは「node build.mjs」を実行してください。
- 名前: 月曜の買取受付（通常）
  投稿しない:
    - "2026-11-02 11:00"
  投稿:
    - 日時: 日 21:00
      対象日: 翌日
      祝日なら休む: はい
      画像: monday-hours.jpg
      本文: |
        【明日{{対象日}}の買取受付につきまして】
        祝日を除く毎週月曜日は、買取受付を下記の通りとさせていただいております。

        ■買取受付時間 16:00〜20:00
        ■受付枚数 お一人様10枚まで

        ご不便をおかけし申し訳ございませんが、何卒ご理解の程よろしくお願いいたします。
        #東京MTG秋葉原
